<div class="adsearch-wrapper">
  <div class="adsearch-sidebar">
    <h2>Search Filters</h2>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <label for="invoice_number">Invoice Number</label>
      <input type="text" id="invoice_number" placeholder="Enter invoice number" formControlName="invoice_number" />

      <label for="bill_to">Bill To</label>
      <input type="text" id="bill_to" placeholder="Enter bill to name" formControlName="bill_to" />
      
      <label for="ship_to">Ship To</label>
      <input type="text" id="ship_to" placeholder="Enter ship to address" formControlName="ship_to" />
      
      <label for="ship_mode">Ship Mode</label>
      <input type="text" id="ship_mode" placeholder="Enter shipping mode" formControlName="ship_mode" />
      
      <label for="start_date">Start Date</label>
      <input type="date" id="start_date" formControlName="start_date" />
      
      <label for="end_date">End Date</label>
      <input type="date" id="end_date" formControlName="end_date" />
      
      <label for="min_total">Min Total</label>
      <input type="number" id="min_total" placeholder="Enter minimum total" formControlName="min_total" />
      
      <label for="max_total">Max Total</label>
      <input type="number" id="max_total" placeholder="Enter maximum total" formControlName="max_total" />
      
      <button type="submit">Search</button>
      <button type="button" (click)="onReset()">Reset</button>
    </form>
  </div>

  

  <div class="adsearch-content">
    <h2>Invoice Results</h2>
    <div *ngIf="searchResults && searchResults.length > 0; else noResults">
      <table>
        <thead>
          <tr>
            <th>Invoice Number</th>
            <th>Date</th>
            <th>Bill To</th>
            <th>Ship To</th>
            <th>Ship Mode</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let invoice of searchResults">
            <td>{{ invoice.invoice_number }}</td>
            <td>{{ invoice.date }}</td>
            <td>{{ invoice.bill_to }}</td>
            <td>{{ invoice.ship_to }}</td>
            <td>{{ invoice.ship_mode }}</td>
            <td>{{ invoice.total }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <ng-template #noResults>
      <p>No results yet. Use filters to find invoices.</p>
    </ng-template>
  </div>
</div>
