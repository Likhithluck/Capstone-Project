<div class="adsearch-wrapper">
  <div class="adsearch-sidebar">
    <h2>Search Filters</h2>
    <form>
      <label for="invoice-id">Invoice ID</label>
      <input type="text" id="invoice-id" placeholder="Enter invoice ID" />

      <label for="date-start">Start Date</label>
      <input type="date" id="date-start" />

      <label for="bill-to">Bill To</label>
      <input type="text" id="bill-to" placeholder="Enter bill to name" />
      
      <label for="ship-to">Ship To</label>
      <input type="text" id="ship-to" placeholder="Enter ship to address" />
      
      <label for="ship-mode">Ship Mode</label>
      <input type="text" id="ship-mode" placeholder="Enter shipping mode" />
      
      <label for="balance-due">Balance Due</label>
      <input type="text" id="balance-due" placeholder="Enter balance due" />
      
      <label for="total">Total</label>
      <input type="text" id="total" placeholder="Enter total amount" />
      
      <label for="notes">Notes</label>
      <input type="text" id="notes" placeholder="Enter notes" />
      
      <label for="order-id">Order ID</label>
      <input type="text" id="order-id" placeholder="Enter order ID" />
      
      
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="adsearch-content">
    <h2>Invoice Results</h2>
    <div class="invoice-table-placeholder">
      <p>No results yet. Use filters to find invoices.</p>
    </div>
  </div>
</div>
