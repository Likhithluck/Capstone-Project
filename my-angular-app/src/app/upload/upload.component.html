<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload Workflow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    

<div class="steps-wrapper">
    <div class="step-container active">
      <div class="step-icon"><i class="fas fa-upload"></i></div>
      <div class="step-label">Upload</div>
    </div>
    <div class="step-arrow"><i class="fas fa-arrow-right"></i></div>
    <div class="step-container">
      <div class="step-icon"><i class="fas fa-robot"></i></div>
      <div class="step-label">Automation</div>
    </div>
    <div class="step-arrow"><i class="fas fa-arrow-right"></i></div>
    <div class="step-container">
      <div class="step-icon"><i class="fas fa-database"></i></div>
      <div class="step-label">Store</div>
    </div>
  </div>
  
  <div class="upload-wrapper">
    <div class="upload-header">
      <h1>Upload Your File</h1>
    </div>
    <div class="upload-box">
      <form (submit)="onSubmit($event)">
        <input type="file" id="file" class="file-input" (change)="onFileChange($event)" required>
        <label for="file" class="file-label">+</label>
        <span class="file-name">{{ fileName }}</span>
        <button type="submit" class="upload-btn">Upload</button>
      </form>
    </div>
    <div *ngIf="uploadSuccess" class="upload-success">
      File uploaded successfully!
    </div>
  </div>
